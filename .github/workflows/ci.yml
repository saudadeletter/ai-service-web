name: Build and integration checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: ai_service
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: ai_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_service -d ai_service_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CHECKPOINT_DISABLE: 1
      TEST_DATABASE_URL: postgresql://ai_service:integration-only-password@127.0.0.1:5432/ai_service_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/deploy.test.mjs tests/container-env.test.mjs
      - run: npm run build
      - run: npm run test:integration
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fresh container deployment without host Node setup
        run: bash deploy.sh docker
      - name: Save configuration fingerprints and a persistence marker
        run: |
          sha256sum .env .admin-credentials > "$RUNNER_TEMP/ai-service-config.sha256"
          docker compose -f compose.yaml exec -T db psql -U ai_service -d ai_service -v ON_ERROR_STOP=1 -c "CREATE TABLE deployment_probe (id integer PRIMARY KEY); INSERT INTO deployment_probe VALUES (1);"
      - name: Stop and redeploy with existing configuration and database
        run: |
          bash deploy.sh docker stop
          bash deploy.sh docker
          sha256sum --check "$RUNNER_TEMP/ai-service-config.sha256"
          test "$(docker compose -f compose.yaml exec -T db psql -U ai_service -d ai_service -Atc 'SELECT count(*) FROM deployment_probe')" = 1
      - name: Container status
        if: always()
        run: docker compose -f compose.yaml ps -a
      - name: Stop test containers
        if: always()
        run: docker compose -f compose.yaml down
