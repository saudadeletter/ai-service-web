name: Build and integration checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: ai_service
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: ai_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_service -d ai_service_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CHECKPOINT_DISABLE: 1
      TEST_DATABASE_URL: postgresql://ai_service:integration-only-password@127.0.0.1:5432/ai_service_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration
